## User routes
/user/profile:
    get:
        tags:
            - User
        summary: Get user profile by decoded ID from token
        responses:
            200:
                description: 'User data fetched'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                message:
                                    type: string
                                data:
                                    $ref: '#/components/schemas/PublicUser'
            404:
                description: 'User not found'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []
