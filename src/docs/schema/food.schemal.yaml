components:
    schemas:
        Dish:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                ingredients:
                    type: string
                price:
                    type: number
                description:
                    type: string
                rating:
                    type: number
                image_url:
                    type: string
                calories:
                    type: integer
                category_id:
                    type: string
                    format: uuid
                restaurant_id:
                    type: string
                    format: uuid
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        CreateDishRequest:
            type: object
            required:
                - name
                - price
                - category_id
                - restaurant_id
                - rating
            properties:
                name:
                    type: string
                price:
                    type: number
                    minimum: 0
                category_id:
                    type: string
                    format: uuid
                restaurant_id:
                    type: string
                    format: uuid
                rating:
                    type: number
                description:
                    type: string
                ingredients:
                    type: string
                calories:
                    type: integer

        UpdateDishRequest:
            type: object
            properties:
                name:
                    type: string
                price:
                    type: number
                    minimum: 0
                category_id:
                    type: string
                    format: uuid
                restaurant_id:
                    type: string
                    format: uuid
                description:
                    type: string
                ingredients:
                    type: string
                calories:
                    type: integer
                rating:
                    type: number
