components:
    schemas:
        Category:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                position:
                    type: integer
                name:
                    type: string
                description:
                    type: string

        CreateCategoryRequest:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                description:
                    type: string
                position:
                    type: integer

        UpdateCategoryRequest:
            type: object
            properties:
                name:
                    type: string
                description:
                    type: string
                position:
                    type: integer
