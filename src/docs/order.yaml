## Order routes
/orders:
    get:
        tags:
            - Order
        summary: Get all orders for the authenticated user
        responses:
            200:
                description: 'List of orders'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                orders:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/Order'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []

/orders/create:
    post:
        tags:
            - Order
        summary: Create a new order
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateOrderRequest'
        responses:
            201:
                description: 'Order created'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                order:
                                    $ref: '#/components/schemas/Order'
            400:
                description: 'Bad Request'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []

/orders/update/{orderId}:
    put:
        tags:
            - Order
        summary: Update an order's items
        parameters:
            - in: path
              name: orderId
              required: true
              schema:
                  type: string
                  format: uuid
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateOrderRequest'
        responses:
            200:
                description: 'Order updated'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                order:
                                    $ref: '#/components/schemas/Order'
            400:
                description: 'Bad Request'
            401:
                description: 'Unauthorized'
            404:
                description: 'Order not found'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []

/orders/status/{orderId}:
    patch:
        tags:
            - Order
        summary: Update order status
        parameters:
            - in: path
              name: orderId
              required: true
              schema:
                  type: string
                  format: uuid
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateOrderStatusRequest'
        responses:
            200:
                description: 'Order status updated'
            400:
                description: 'Bad Request'
            401:
                description: 'Unauthorized'
            404:
                description: 'Order not found'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []
