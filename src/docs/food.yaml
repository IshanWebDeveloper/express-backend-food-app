## Dish routes
/dishes:
    get:
        tags:
            - Dish
        summary: Get all dishes
        responses:
            200:
                description: 'List of dishes'
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/Dish'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []
    post:
        tags:
            - Dish
        summary: Create a new dish
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateDishRequest'
        responses:
            201:
                description: 'Dish created'
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                message:
                                    type: string
                                data:
                                    $ref: '#/components/schemas/Dish'
            400:
                description: 'Bad Request'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []

/dishes/{dishid}:
    get:
        tags:
            - Dish
        summary: Get a dish by ID
        parameters:
            - in: path
              name: dishid
              required: true
              schema:
                  type: string
                  format: uuid
        responses:
            200:
                description: 'Dish'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Dish'
            404:
                description: 'Dish not found'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []
    put:
        tags:
            - Dish
        summary: Update a dish
        parameters:
            - in: path
              name: dishid
              required: true
              schema:
                  type: string
                  format: uuid
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateDishRequest'
        responses:
            200:
                description: 'Updated dish'
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Dish'
            400:
                description: 'Bad Request'
            401:
                description: 'Unauthorized'
            404:
                description: 'Dish not found'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []
    delete:
        tags:
            - Dish
        summary: Delete a dish
        parameters:
            - in: path
              name: dishid
              required: true
              schema:
                  type: string
                  format: uuid
        responses:
            200:
                description: 'Dish deleted successfully'
            401:
                description: 'Unauthorized'
            404:
                description: 'Dish not found'
            500:
                description: 'Internal server error'
        security:
            - bearerAuth: []

# Extra dish endpoints
/dishes/with-category:
    get:
        tags:
            - Dish
        summary: Get all dishes with category
        responses:
            200:
                description: 'List of dishes with category'
            401:
                description: 'Unauthorized'
            500:
                description: 'Internal server error'
